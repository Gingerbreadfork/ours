[workspace]
resolver = "3"
members = [
    "crates/ours-types",
    "crates/ours-connector",
    "crates/ours-core",
    "crates/ours-store",
    "crates/ours-connector-discord",
    "crates/ours-connector-slack",
    "crates/ours-connector-telegram",
    "crates/ours-model",
    "crates/ours-admin",
    "crates/ours-mail",
    "crates/ours",
]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/Gingerbreadfork/ours"

[workspace.dependencies]
ours-types = { path = "crates/ours-types" }
ours-connector = { path = "crates/ours-connector" }
ours-core = { path = "crates/ours-core" }
ours-store = { path = "crates/ours-store" }
ours-connector-discord = { path = "crates/ours-connector-discord" }
ours-connector-slack = { path = "crates/ours-connector-slack" }
ours-connector-telegram = { path = "crates/ours-connector-telegram" }
ours-model = { path = "crates/ours-model" }
ours-admin = { path = "crates/ours-admin" }
ours-mail = { path = "crates/ours-mail" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
insta = { version = "1.49.0", features = ["json"] }
jiff = { version = "0.2.38", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls", "aws-lc-rs", "webpki-roots", "builder", "hostname", "pool"] }
mail-parser = "1.0.1"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
proptest = "1.12.0"
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled", "serde_json"] }
rust-embed = "8.13.0"
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
twilight-gateway = "0.18.0"
twilight-http = "0.18.0"
twilight-model = "0.18.0"
ulid = { version = "3.0.0", features = ["serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
