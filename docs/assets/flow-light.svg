<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-label="One message through Ours"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker></defs><rect x="20" y="40" width="130" height="60" rx="6" fill="#ffffff" stroke="#1b1b1f" stroke-width="1.5"/><text x="85.0" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1b1f">Connector</text><text x="85.0" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" fill="#5b5b63">Discord, Slack, Telegram</text><line x1="150" y1="70" x2="190" y2="70" stroke="#1b1b1f" stroke-width="1.5" marker-end="url(#a)"/><text x="170" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">event</text><rect x="190" y="40" width="170" height="60" rx="6" fill="#ffffff" stroke="#1b1b1f" stroke-width="1.5"/><text x="275.0" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1b1f">Engine</text><text x="275.0" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">step(state, input, now)</text><line x1="360" y1="70" x2="400" y2="70" stroke="#1b1b1f" stroke-width="1.5" marker-end="url(#a)"/><text x="380" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">effects</text><rect x="400" y="40" width="150" height="60" rx="6" fill="#ffffff" stroke="#1b1b1f" stroke-width="1.5"/><text x="475.0" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1b1f">Runner</text><text x="475.0" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">sends, timers, asks</text><line x1="550" y1="70" x2="590" y2="70" stroke="#1b1b1f" stroke-width="1.5" marker-end="url(#a)"/><rect x="590" y="40" width="150" height="60" rx="6" fill="#ffffff" stroke="#1b1b1f" stroke-width="1.5"/><text x="665.0" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1b1f">Outside</text><text x="665.0" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">model, mail, room</text><path d="M 665 100 L 665 140 L 320 140 L 320 100" fill="none" stroke="#1b1b1f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="492" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">every answer comes back as an input</text><rect x="150" y="180" width="440" height="44" rx="6" fill="#c8562c" fill-opacity="0.14" stroke="#c8562c" stroke-width="1.5"/><text x="370" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1b1f">Journal: every input, hash-chained, one SQLite file per group</text><line x1="230" y1="100" x2="230" y2="180" stroke="#c8562c" stroke-width="1.5"/><text x="222" y="150" text-anchor="end" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">logged first</text><text x="370" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#5b5b63">replay is folding the journal again; the state is never the source of truth</text></svg>